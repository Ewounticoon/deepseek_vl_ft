seed: 42

data:
  hf_dataset_dir: "data/hf_dataset"
  train_split: "train"
  eval_split: "eval"
  data_root: data

model:
  base_model: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"

lora:
  r: 16
  alpha: 16
  dropout: 0.05

train:
  output_dir: "outputs/finetuned"
  max_steps: 900
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2e-4
  warmup_steps: 0
  logging_steps: 10
  save_steps: 50
  eval_steps: 5
  max_seq_length: 2048
  report_to: ["tensorboard"]
