model:
  name: deepseek-ai/deepseek-vl-7b-base
  torch_dtype: float16           # 3090 OK
  gradient_checkpointing: true   # réduit la VRAM pendant train

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "o_proj"]

dataset:
  jsonl_path: data/dataset.jsonl
  image_root: data/images
  # ton champ JSONL contient "images/xxx.png", donc on strip "images/"
  strip_image_prefix: "images/"

  add_system_prompt: false
  system_prompt: |
    Tu es un assistant visuel.
    Tu analyses l'image fournie et réponds STRICTEMENT en Markdown propre,
    structuré avec des titres, listes et blocs si nécessaire.
    N'ajoute aucun texte hors Markdown.

training:
  output_dir: outputs/lora-deepseek-vl-ocr-md
  lr: 1e-4
  weight_decay: 0.0
  batch_size: 1
  grad_accum: 16
  max_steps: 200
  save_every: 500
  log_every: 10
  num_workers: 2
  seed: 42

generation_smoketest:
  max_new_tokens: 128
